<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispositivos - Fungu</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="nav-container"></div>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold mb-6">Dispositivos</h1>

        <div id="error-msg" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>
        <div id="success-msg" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

        <div class="grid md:grid-cols-2 gap-6 mb-10">
            <!-- Cadastro de mestre -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-lg font-semibold mb-4">Cadastrar Mestre</h2>
                <div class="space-y-4">
                    <input type="text" id="master-mac" placeholder="MAC do mestre (ex: AA:BB:CC:DD:EE:FF)" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="register-master-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Cadastrar Mestre</button>
                </div>
            </div>

            <!-- Cadastro de escravo -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-lg font-semibold mb-4">Cadastrar Escravo</h2>
                <div class="space-y-4">
                    <input type="text" id="slave-mac-master" placeholder="MAC do mestre" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="slave-mac" placeholder="MAC do escravo" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="register-slave-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Cadastrar Escravo</button>
                </div>
            </div>
        </div>

        <!-- Lista de dispositivos -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold mb-4">Dispositivos Cadastrados</h2>
            <div id="masters-list"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/devices.js"></script>
</body>
</html>
