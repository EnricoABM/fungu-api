<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Fungu</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="nav-container"></div>

    <div class="max-w-2xl mx-auto p-6 space-y-6">
        <h1 class="text-2xl font-bold text-center">Perfil</h1>

        <div class="bg-white rounded-lg shadow-md p-8">
            <h2 class="text-lg font-semibold mb-4">Informações do Usuário</h2>
            <div class="space-y-2">
                <p><span class="font-medium">ID:</span> <span id="user-id">--</span></p>
                <p><span class="font-medium">E-mail:</span> <span id="user-email">--</span></p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-8">
            <h2 class="text-lg font-semibold mb-4">Contatos</h2>
            <div class="space-y-4">
                <input type="text" id="telegram-chat-id" placeholder="Telegram Chat ID" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="email" id="alert-email" placeholder="E-mail para alertas" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="save-contacts-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Salvar Contatos</button>
                <div id="contacts-msg" class="hidden text-sm mt-2 text-center"></div>
            </div>
        </div>

        <div class="flex items-center justify-between">
            <a href="alerts.html" class="text-blue-600 hover:underline">Configurar Alertas</a>
            <button id="logout-btn" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700">Sair</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
